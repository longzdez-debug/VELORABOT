[project]
name = "velora"
version = "0.1.0"
description = "VELORA market intelligence Telegram bot and Mini App"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.24,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "redis>=5,<8",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
